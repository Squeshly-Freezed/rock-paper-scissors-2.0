<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset = "UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href = "style.css">
    <script src = "javascript.js" defer></script>
    <title>Rock Paper Scissors</title>
</head>
<body>
    <div id = "main">
        <div id = "header">
            <h1>Rock-Paper-Scissors</h1>
        </div>
            <dialog id = "welcome-box">
                <span id = "welcome-span">Welcome to Rock Paper Scissors!<br><br>The first player to win 5 rounds<br>wins the game!</span>
            </dialog>
            <dialog id = "win-box">
                <span id = "win-span">Congratulations!<br><br>You've won the game!</span>
            </dialog>
            <dialog id = "lose-box">
                <span id = "lose-span">Too bad!<br><br>You've lost the game!</span>
            </dialog>
        <div id = "scoreboard">
            scoreboard
        </div>
        <div id = "results">
            results
        </div>
        <div id = "rpsChosen">
            <img id = "home-chosen" src = "/" alt = "What has Home chosen?">
            <img id = "guest-chosen" src = "/" alt = "What has Guest chosen?">
        </div>
        <div id = "rpsContainer">
            <button id = "rock-button"><img id = "rock-image" src = "imgs/rock.png" alt = "rock"></button>
            <button id = "paper-button"><img id = "paper-image" src = "imgs/paper.png" alt = "paper"></button>
            <button id = "scissors-button"><img id = "scissors-image" src = "imgs/scissors.png" alt = "scissors"></button>
        </div>
        <div id = "footer">
            <p>Copyright © 2026 SqueshlyFreezed</p>
        </div>
    </div>

</body>
</html>
